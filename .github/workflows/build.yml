name: Build PhanHoaiRedline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking repository files"
          ls -la
          find . -maxdepth 5 -type f -not -path './.git/*' | sort

      - name: Package repository files
        run: |
          mkdir -p output
          zip -r output/PhanHoaiRedline-source.zip . \
            -x "./.git/*" \
            -x "./output/*"

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: PhanHoaiRedline-source
          path: output/PhanHoaiRedline-source.zip
          if-no-files-found: error
          retention-days: 1